<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LedgerPeak Office</title>
<!--LP:HEAD-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a framed pixel office (canvas) with a Command Center beside it and a staff roster underneath, like a top-down management game. Single deliberate light look. */
:root {
  --frame: #fbf3dc; --frame-edge: #2b2620; --ink: #2b2620; --muted: #7a6f5c; --panel: #fffaf0;
  --accent: #e8a33d; --accent-ink: #4a3208; --line: #d9ccae; --term: #24211c; --term-ink: #e9e2cf;
  --work: #3c9d5d; --wait: #d0812a; --idle: #9a917f;
  --pixel: "Silkscreen", "Courier New", monospace; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9dfc6; color: var(--ink); font: 14px/1.4 var(--body); }
.wrap { padding-block: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; margin: 0 auto; }
.app { background: var(--frame); border: 3px solid var(--frame-edge); border-radius: 6px; box-shadow: 0 4px 0 var(--frame-edge); overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 3px solid var(--frame-edge); font-family: var(--pixel); font-size: 12px; flex-wrap: wrap; }
.topbar .logo { color: var(--accent); }
.topbar .ver { color: var(--muted); }
.topbar .kpi { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; }
.topbar .kpi b { font-variant-numeric: tabular-nums; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; padding: 10px; background: #1d1a16; min-width: 0; }
.stage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 2px solid #000; }
.labels { position: absolute; inset: 10px; pointer-events: none; }
.tag { position: absolute; translate: -50% -100%; font-family: var(--mono); font-size: 10px; white-space: nowrap; pointer-events: auto; cursor: pointer; }
.tag .bubble { display: block; background: #fff; color: #111; border: 2px solid #111; border-radius: 4px; padding: 1px 6px; margin-bottom: 3px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.tag .bubble:empty { display: none; }
.tag .name { display: inline-block; background: rgba(0,0,0,.55); color: #fff; padding: 0 4px; border-radius: 2px; font-family: var(--pixel); font-size: 9px; }
.tag.done .name { background: var(--work); }
.tag.sel .name { background: var(--accent); color: var(--accent-ink); }
.roomtag { position: absolute; font-family: var(--pixel); font-size: 9px; color: #3a4a3d; opacity: .75; pointer-events: none; text-transform: uppercase; }
.side { border-left: 3px solid var(--frame-edge); display: flex; flex-direction: column; min-width: 0; }
@media (max-width: 900px) { .side { border-left: 0; border-top: 3px solid var(--frame-edge); } }
.cc-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 2px solid var(--line); }
.cc-head canvas { width: 40px; height: 40px; image-rendering: pixelated; border: 2px solid var(--frame-edge); background: #cfe0cf; flex: none; }
.cc-head .t { font-family: var(--pixel); font-size: 12px; }
.cc-head .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 0 6px; border: 2px solid var(--frame-edge); border-radius: 3px; background: var(--panel); }
.pill.working { background: var(--work); color: #fff; } .pill.done { background: #cfe8d6; } .pill.waiting { background: var(--wait); color: #fff; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px 12px; border-bottom: 2px solid var(--line); }
.tabs button { font-family: var(--mono); font-size: 11px; border: 2px solid var(--frame-edge); background: var(--panel); border-radius: 3px; padding: 3px 4px; cursor: pointer; color: var(--ink); }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.tabs button:focus-visible, .roster button:focus-visible, .queue button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.pane { flex: 1; min-height: 220px; max-height: 360px; overflow: auto; margin: 8px 12px; background: var(--term); color: var(--term-ink); font-family: var(--mono); font-size: 12px; padding: 8px 10px; border-radius: 3px; }
.pane p { margin: 0 0 6px; }
.pane .dim { color: #9d957f; }
.pane .ok { color: #8fd19e; } .pane .go { color: #f2c46d; }
.pane h4 { margin: 8px 0 4px; font-size: 12px; color: #f2c46d; font-weight: 600; }
.queue { padding: 0 12px 12px; }
.queue label { font-family: var(--pixel); font-size: 11px; display: block; margin: 4px 0; }
.queue textarea { width: 100%; height: 64px; resize: vertical; font: 12px var(--mono); border: 2px solid var(--frame-edge); border-radius: 3px; background: var(--panel); padding: 6px; color: var(--ink); }
.queue .row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.queue button { font-family: var(--mono); font-size: 12px; border: 2px solid var(--frame-edge); background: var(--panel); border-radius: 3px; padding: 3px 10px; cursor: pointer; color: var(--ink); }
.queue button.primary { background: var(--accent); color: var(--accent-ink); margin-left: auto; }
.queue .note { font-size: 11px; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
.roster { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; border-top: 3px solid var(--frame-edge); background: var(--frame); }
.roster button { flex: none; width: 200px; display: grid; grid-template-columns: 40px 1fr; gap: 2px 8px; text-align: left; border: 2px solid var(--frame-edge); background: var(--panel); border-radius: 4px; padding: 6px; cursor: pointer; font: inherit; color: var(--ink); }
.roster button.sel { box-shadow: inset 0 0 0 2px var(--accent); background: #fff3d6; }
.roster canvas { grid-row: span 3; width: 40px; height: 40px; image-rendering: pixelated; background: #cfe0cf; border: 1px solid var(--frame-edge); }
.roster .n { font-family: var(--pixel); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster .r { font-size: 11px; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot { font-size: 12px; color: var(--muted); padding: 8px 2px 0; }
.foot a { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .tag .bubble { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
<div class="app">
  <div class="topbar"><span class="logo">▲</span> LedgerPeak HQ <span class="ver" id="mode">auto mode on</span>
    <div class="kpi" id="kpi"></div></div>
  <div class="main">
    <div class="stage" id="stage"><canvas id="cv" width="640" height="368" aria-label="Pixel office floor plan"></canvas><div class="labels" id="labels"></div></div>
    <aside class="side">
      <div class="cc-head"><canvas id="ccAvatar" width="16" height="16"></canvas>
        <div style="min-width:0"><div class="t">Command Center</div><div class="s" id="ccWho"></div></div></div>
      <div class="tabs" id="tabs">
        <button data-p="terminal" class="on" type="button">terminal</button><button data-p="tasks" type="button">tasks</button><button data-p="skills" type="button">skills</button>
        <button data-p="memory" type="button">memory</button><button data-p="activity" type="button">activity</button><button data-p="workers" type="button">workers</button>
      </div>
      <div class="pane" id="pane" tabindex="0"></div>
      <div class="queue">
        <label for="q">Queue a task</label>
        <textarea id="q" placeholder="e.g. onboard a new plumber client in Wealdstone and prepare their first MTD update"></textarea>
        <div class="row"><button type="button" id="demoBtn">watch demo</button><button type="button" class="primary" id="sendBtn">send →</button></div>
        <div class="note" id="qnote"></div>
      </div>
    </aside>
  </div>
  <div class="roster" id="roster"></div>
</div>
<div class="foot" id="foot">Live when opened from your LedgerPeak folder while Claude Code runs. <a href="index.html">Reports view</a></div>
</div>

<script src="data/data.js"></script>
<script src="data/live.js" onerror="this.remove()"></script>
<script>
(function () {
  const D = window.LP_DATA || { agents: [], kpi: {}, log: [], tasks: [], updates: [] };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const T = 16, W = 40, H = 23;
  const cv = $('cv'), g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;

  // ---------- map ----------
  // zones: rooms with a door onto the corridor (rows 7-9)
  const Z = {
    ceo:   { x: 1, y: 1, w: 8, h: 5, door: 5, name: "Parth's office", top: true },
    meet:  { x: 10, y: 1, w: 13, h: 5, door: 16, name: 'Meeting room', top: true },
    lead:  { x: 24, y: 1, w: 15, h: 5, door: 31, name: 'Leadership', top: true },
    grow:  { x: 1, y: 11, w: 8, h: 11, door: 4, name: 'Growth' },
    cs:    { x: 10, y: 11, w: 7, h: 11, door: 13, name: 'Client Services' },
    book:  { x: 18, y: 11, w: 7, h: 11, door: 21, name: 'Bookkeeping' },
    legal: { x: 26, y: 11, w: 5, h: 11, door: 28, name: 'Legal' },
    lab:   { x: 32, y: 11, w: 7, h: 11, door: 35, name: 'Innovation Lab' },
  };
  const DEPT_ZONE = { 'Leadership': 'lead', 'Growth': 'grow', 'Client Services': 'cs', 'Bookkeeping & Reporting': 'book', 'Legal & Compliance': 'legal', 'Innovation & Learning Lab': 'lab' };
  const CORR = 8;            // corridor walking row
  const KITCHEN = { x: 37, y: 8 };

  // desks: [x, y] top-left tile of a 2-wide desk; seat is one row below
  const DESKS = {
    parth: [4, 2],
    'grace-whitmore': [26, 2], 'ava-sterling': [30, 2],
    'henry-collins': [2, 13], 'charlotte-quinn': [5, 13],
    'sophie-bennett': [11, 13], 'emily-brooks': [14, 13],
    'leo-hartley': [19, 13], 'james-whitfield': [22, 13],
    'victor-hale': [27, 13],
    'theo-ashford': [33, 13], 'iris-bell': [36, 13],
  };
  const SPARE = [[34, 2], [2, 18], [5, 18], [11, 18], [14, 18], [19, 18], [22, 18], [27, 18], [33, 18], [36, 18]];

  const C = { floor: '#a9c1a8', floor2: '#9fb89f', grid: '#94ad94', wall: '#f4f1e8', wallEdge: '#3a3a3a', wallTop: '#ffffff',
    desk: '#d6a35c', deskEdge: '#8a5f2b', chair: '#e0b56b', mon: '#2a2d33', screen: '#2d3b4f', screenOn: '#7fd6b4',
    plant: '#4c8c3f', pot: '#b86a3c', rug: '#c9a7b8', table: '#c48a4f', seat: '#a4486a', corridor: '#b7cbb5', window: '#8fb7d6' };

  function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
  function drawFloor() {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      rect(x * T, y * T, T, T, (x + y) % 2 ? C.floor : C.floor2);
      rect(x * T, y * T, T, 1, C.grid); rect(x * T, y * T, 1, T, C.grid);
    }
    for (let x = 1; x < W - 1; x++) for (let y = 7; y <= 9; y++) rect(x * T, y * T, T, T, (x + y) % 2 ? C.corridor : '#adc3ab');
  }
  function wallH(x0, x1, y, gaps = []) { for (let x = x0; x <= x1; x++) if (!gaps.includes(x)) { rect(x * T, y * T, T, T, C.wall); rect(x * T, y * T + T - 3, T, 3, C.wallEdge); rect(x * T, y * T, T, 2, C.wallTop); } }
  function wallV(x, y0, y1) { for (let y = y0; y <= y1; y++) { rect(x * T + 4, y * T, 8, T, C.wall); rect(x * T + 4, y * T, 1, T, C.wallEdge); rect(x * T + 11, y * T, 1, T, C.wallEdge); } }
  function windowAt(x) { rect(x * T + 2, 3, T * 2 - 4, 9, C.wallEdge); rect(x * T + 3, 4, T - 4, 7, C.window); rect(x * T + T + 1, 4, T - 4, 7, C.window); }
  function plant(x, y) { rect(x * T + 5, y * T + 9, 6, 6, C.pot); rect(x * T + 3, y * T + 2, 10, 8, C.plant); rect(x * T + 6, y * T, 4, 4, '#5fa34f'); }
  function desk(x, y, on) {
    rect(x * T, y * T + 4, T * 2, T - 2, C.deskEdge); rect(x * T + 1, y * T + 4, T * 2 - 2, T - 5, C.desk);
    rect(x * T + 10, y * T - 3, 12, 9, C.mon); rect(x * T + 11, y * T - 2, 10, 6, on ? C.screenOn : C.screen);
    if (on) { const t = (Date.now() / 120 | 0) % 4; rect(x * T + 12, y * T - 1 + t, 6, 1, '#1e5a45'); }
    rect(x * T + 14, y * T + 6, 4, 2, C.mon);
    rect(x * T + 9, y * T + T + 3, 14, 10, C.chair); rect(x * T + 9, y * T + T + 3, 14, 2, C.deskEdge);
  }
  function drawStatic(liveSet) {
    drawFloor();
    // outer walls
    wallH(0, W - 1, 0); wallH(0, W - 1, H - 1);
    wallV(0, 0, H - 1); wallV(W - 1, 0, H - 1);
    [3, 13, 19, 28, 34].forEach(windowAt);
    // top rooms
    wallH(1, W - 2, 6, [Z.ceo.door, Z.meet.door, Z.lead.door]);
    wallV(9, 1, 6); wallV(23, 1, 6);
    // bottom departments
    wallH(1, W - 2, 10, [Z.grow.door, Z.cs.door, Z.book.door, Z.legal.door, Z.lab.door]);
    [9, 17, 25, 31].forEach((x) => wallV(x, 10, H - 2));
    // meeting room table and chairs
    rect(13 * T, 2 * T + 4, 7 * T, 2 * T, C.deskEdge); rect(13 * T + 2, 2 * T + 6, 7 * T - 4, 2 * T - 4, C.table);
    for (let i = 0; i < 5; i++) { rect((13.6 + i * 1.3) * T, 1 * T + 10, 10, 8, C.seat); rect((13.6 + i * 1.3) * T, 4 * T + 8, 10, 8, C.seat); }
    plant(11, 2); plant(21, 4);
    // ceo rug + water cooler + kitchen
    rect(2 * T, 4 * T, 5 * T, 1.6 * T, C.rug);
    rect(KITCHEN.x * T, 7 * T, T, 2 * T, '#e9eef0'); rect(KITCHEN.x * T + 3, 7 * T + 2, 10, 8, '#7fb3d9'); // cooler
    rect(35 * T, 7 * T - 2, 2 * T, 10, '#8a8f96'); rect(35 * T + 4, 7 * T, 8, 5, '#3a3a3a'); // coffee bar
    plant(1, 7); plant(38, 21); plant(1, 21); plant(24, 7);
    // noticeboards
    rect(12 * T, 10 * T + 3, 3 * T, 9, '#e7c3b3'); rect(20 * T, 10 * T + 3, 3 * T, 9, '#f1dd8c');
    // desks
    Object.entries(DESKS).forEach(([id, [x, y]]) => desk(x, y, liveSet.has(id)));
    SPARE.forEach(([x, y]) => desk(x, y, false));
    // filing cabinets
    [[24, 15], [24, 17], [16, 20]].forEach(([x, y]) => { rect(x * T + 2, y * T, 12, T + 6, '#9aa3ad'); rect(x * T + 4, y * T + 4, 8, 2, '#5b636b'); rect(x * T + 4, y * T + 12, 8, 2, '#5b636b'); });
  }

  // ---------- people ----------
  const PEOPLE = [{ id: 'parth', name: 'Parth Prajapati', role: 'CEO · signing officer', dept: 'CEO', hair: '#1d1a18', skin: '#b07a52', shirt: '#2b2f3a' }]
    .concat(D.agents.map((a) => Object.assign({}, a)));
  const seatOf = (id) => { const d = DESKS[id]; return { x: d[0] + 1, y: d[1] + 1.55 }; };
  const zoneOf = (p) => p.id === 'parth' ? Z.ceo : Z[DEPT_ZONE[p.dept]];
  PEOPLE.forEach((p, i) => {
    const s = seatOf(p.id); p.x = s.x; p.y = s.y; p.path = []; p.status = 'idle'; p.task = ''; p.sitting = true;
    p.nextWander = Date.now() + 4000 + i * 2300 + Math.random() * 9000; p.where = 'desk';
  });
  const byId = Object.fromEntries(PEOPLE.map((p) => [p.id, p]));

  function route(p, tx, ty, tzone) {
    const fz = p.where === 'desk' ? zoneOf(p) : null;
    const pts = [];
    if (fz) { pts.push({ x: p.x, y: fz.top ? 5.5 : 12 }); pts.push({ x: fz.door + 0.5, y: fz.top ? 5.5 : 12 }); pts.push({ x: fz.door + 0.5, y: CORR }); }
    else pts.push({ x: p.x, y: CORR });
    if (tzone) { pts.push({ x: tzone.door + 0.5, y: CORR }); pts.push({ x: tzone.door + 0.5, y: tzone.top ? 5.5 : 12 }); pts.push({ x: tx, y: tzone.top ? 5.5 : 12 }); pts.push({ x: tx, y: ty }); }
    else { pts.push({ x: tx, y: CORR }); pts.push({ x: tx, y: ty }); }
    p.path = pts; p.sitting = false;
  }
  function goToDesk(p) { if (p.where === 'desk' && !p.path.length) { p.sitting = true; return; } const s = seatOf(p.id); route(p, s.x, s.y, zoneOf(p)); p.where = 'desk'; }
  function wander(p) {
    const spots = [{ x: KITCHEN.x - 0.5, y: 8.6 }, { x: 35.5, y: 8.4 }, { x: 18 + Math.random() * 6, y: 7.6 + Math.random() * 1.6 }, { x: 6 + Math.random() * 8, y: 8 }];
    const s = spots[(Math.random() * spots.length) | 0];
    route(p, s.x, s.y, null); p.where = 'out';
  }

  function sprite(ctx, p, px, py, sc, t) {
    const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(px + x * sc, py + y * sc, w * sc, h * sc); };
    const walking = !p.sitting && p.path && p.path.length;
    const step = walking ? ((t / 140) | 0) % 2 : 0;
    // legs
    if (!p.sitting) { R(4, 13, 2, 3 - step, '#2c2c34'); R(7, 13, 2, 2 + step, '#2c2c34'); }
    // body
    R(3, 8, 7, 6, p.shirt); R(2, 9, 1, 4, p.shirt); R(10, 9, 1, 4, p.shirt);
    const typing = p.sitting && p.status === 'working';
    R(2, 12 + (typing && ((t / 110) | 0) % 2 ? -1 : 0), 1, 1, p.skin); R(10, 12 + (typing && ((t / 110) | 0) % 2 ? 0 : -1), 1, 1, p.skin);
    // head
    R(3, 2, 7, 6, p.skin); R(3, 1, 7, 2, p.hair); R(2, 2, 1, 3, p.hair); R(10, 2, 1, 3, p.hair);
    R(5, 4, 1, 1, '#1a1a1a'); R(8, 4, 1, 1, '#1a1a1a');
    if (p.id === 'parth') R(4, 0, 5, 1, '#e8a33d');
  }

  // ---------- labels ----------
  const labels = $('labels');
  Object.values(Z).forEach((z) => { const d = document.createElement('div'); d.className = 'roomtag'; d.textContent = z.name;
    d.style.left = (z.x / W * 100 + 0.4) + '%'; d.style.top = ((z.y + (z.top ? 3.9 : 0.1)) / H * 100) + '%'; labels.appendChild(d); });
  PEOPLE.forEach((p) => {
    const d = document.createElement('div'); d.className = 'tag'; d.innerHTML = '<span class="bubble"></span><span class="name"></span>';
    d.querySelector('.name').textContent = p.name.split(' ')[0];
    d.addEventListener('click', () => select(p.id)); p.el = d; labels.appendChild(d);
  });

  // ---------- state ----------
  let selected = 'grace-whitmore', pane = 'terminal', feed = [], demoUntil = 0;
  function applyLive(L) {
    if (!L) return;
    const ag = L.agents || {};
    PEOPLE.forEach((p) => {
      if (p.id === 'parth') {
        const st = (L.parth || {}).status || 'idle';
        p.status = st === 'giving task' ? 'working' : st === 'reviewing' ? 'done' : 'idle';
        p.task = st === 'giving task' ? 'New task!' : st === 'reviewing' ? 'Review time' : '';
      } else {
        const s = ag[p.id]; const before = p.status;
        p.status = s ? s.status : 'idle'; p.task = s ? s.task : '';
        if (p.status === 'working' && before !== 'working') goToDesk(p);
      }
    });
    feed = (L.feed || []).slice(-60);
    $('mode').textContent = Date.now() < demoUntil ? 'demo running' : (L.updated ? 'live · ' + L.updated.slice(11) : 'auto mode on');
  }
  applyLive(window.LP_LIVE);

  // ---------- render loop ----------
  function frame() {
    const t = Date.now();
    const live = new Set(PEOPLE.filter((p) => p.status === 'working' && p.sitting).map((p) => p.id));
    drawStatic(live);
    PEOPLE.forEach((p) => {
      if (p.path.length) {
        const n = p.path[0]; const sp = 0.06;
        const dx = n.x - p.x, dy = n.y - p.y;
        if (Math.abs(dx) > sp) p.x += Math.sign(dx) * sp; else if (Math.abs(dy) > sp) { p.x = n.x; p.y += Math.sign(dy) * sp; }
        else { p.x = n.x; p.y = n.y; p.path.shift(); if (!p.path.length) p.sitting = p.where === 'desk'; }
      } else if (p.status !== 'working' && t > p.nextWander && p.id !== 'parth') {
        if (p.where === 'desk') wander(p); else goToDesk(p);
        p.nextWander = t + 7000 + Math.random() * 14000;
      } else if (p.status === 'working' && p.where !== 'desk') goToDesk(p);
    });
    PEOPLE.slice().sort((a, b) => a.y - b.y).forEach((p) => sprite(g, p, p.x * T - 8.5, p.y * T - 19, 1.3, t));
    PEOPLE.forEach((p) => {
      p.el.style.left = (p.x / W * 100) + '%'; p.el.style.top = ((p.y - 1.3) / H * 100) + '%';
      p.el.querySelector('.bubble').textContent = p.status === 'working' ? p.task : '';
      p.el.classList.toggle('sel', p.id === selected); p.el.classList.toggle('done', p.status === 'done');
    });
    requestAnimationFrame(frame);
  }

  // ---------- avatars ----------
  function avatar(c, p) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.clearRect(0, 0, 16, 16); const q = Object.assign({}, p, { sitting: true, status: 'idle', path: [] }); sprite(x, q, 1.5, 0, 1, 0); }

  // ---------- roster ----------
  const roster = $('roster');
  PEOPLE.forEach((p) => {
    const b = document.createElement('button'); b.type = 'button'; b.id = 'r-' + p.id;
    b.innerHTML = `<canvas width="16" height="16"></canvas><span class="n">${esc(p.name)}</span><span><span class="pill">idle</span></span><span class="r">${esc(p.role)}</span>`;
    avatar(b.querySelector('canvas'), p); b.addEventListener('click', () => select(p.id)); roster.appendChild(b);
  });
  function paintRoster() {
    PEOPLE.forEach((p) => { const b = $('r-' + p.id); const pl = b.querySelector('.pill'); pl.className = 'pill ' + p.status; pl.textContent = p.status; b.classList.toggle('sel', p.id === selected); });
  }

  // ---------- command center ----------
  function select(id) { selected = id; const p = byId[id]; avatar($('ccAvatar'), p);
    $('ccWho').innerHTML = `<span class="pill ${p.status}">${esc(p.status)}</span> ${esc(p.name)} · ${esc(p.role)}`; paintPane(); paintRoster(); }
  const nameOf = (id) => (byId[id] || { name: id }).name;
  function paintPane() {
    const p = byId[selected]; let h = '';
    if (pane === 'terminal') {
      const mine = selected === 'grace-whitmore' || selected === 'parth' ? feed : feed.filter((f) => f.who === selected);
      h = `<p class="dim">live · ${esc(p.name)}</p>` + (mine.length ? mine.slice(-25).map((f) => `<p><span class="dim">${esc((f.time || '').slice(-8))}</span> <span class="${/^Finished|done|ready/i.test(f.text) ? 'ok' : 'go'}">●</span> <b>${esc(nameOf(f.who).split(' ')[0])}</b> ${esc(f.text)}</p>`).join('')
        : '<p class="dim">Nothing yet. Queue a task below, or press watch demo.</p>');
    } else if (pane === 'tasks') {
      h = '<h4>Active tasks (office/tasks/active.md)</h4>' + ((D.tasks || []).map((t) => `<p>${esc(t)}</p>`).join('') || '<p class="dim">No tasks on the board. Grace adds one for every /task.</p>');
    } else if (pane === 'skills') {
      h = `<h4>${esc(p.name)}</h4><p>${esc(p.skills || (p.id === 'parth' ? 'CEO and signing officer. Approves everything before it leaves the office. AAT student.' : ''))}</p>` + (p.model ? `<p class="dim">model: ${esc(p.model)}</p>` : '') + (p.description ? `<h4>When to call them</h4><p>${esc(p.description)}</p>` : '');
    } else if (pane === 'memory') {
      h = `<h4>Briefings from Theo</h4>` + ((p.briefings || []).map((b) => `<p>${esc(b)}</p>`).join('') || '<p class="dim">No lessons yet. Run /teach.</p>') +
        '<h4>What is new (knowledge/updates.md)</h4>' + (D.updates || []).map((u) => `<p>${esc(u)}</p>`).join('');
    } else if (pane === 'activity') {
      h = '<h4>Work log</h4>' + (D.log || []).map((l) => `<p>${esc(l)}</p>`).join('');
    } else if (pane === 'workers') {
      h = PEOPLE.map((q) => `<p><span class="${q.status === 'working' ? 'go' : q.status === 'done' ? 'ok' : 'dim'}">●</span> <b>${esc(q.name)}</b> <span class="dim">${esc(q.role)}${q.model ? ' · ' + esc(q.model) : ''}</span>${q.task ? '<br>' + esc(q.task) : ''}</p>`).join('');
    }
    $('pane').innerHTML = h;
    if (pane === 'terminal') $('pane').scrollTop = 1e6;
  }
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; pane = b.dataset.p;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); paintPane(); });

  // ---------- KPIs ----------
  const k = D.kpi || {};
  $('kpi').innerHTML = [['clients', k.payingClients], ['MRR', '£' + (k.mrr || 0)], ['leads', k.leadsInPipeline], ['overdue', k.overdueInvoices], ['AAT', k.aatProgress], ['compliance', k.complianceDone]]
    .map(([l, v]) => `<span>${l} <b>${esc(v ?? '–')}</b></span>`).join('');

  // ---------- queue + demo ----------
  function playDemo(taskText) {
    const task = taskText || 'Onboard a new café client and prepare their first VAT return';
    const L = { agents: {}, feed: [], parth: { status: 'giving task' } };
    const steps = [
      ['parth', null, 'New task: ' + task],
      ['grace-whitmore', 'working', 'Planning: split into steps by department'],
      ['theo-ashford', 'working', 'Checking latest GOV.UK guidance'],
      ['sophie-bennett', 'working', 'AML checks and risk rating'],
      ['theo-ashford', 'done', 'Briefed the team on what changed'],
      ['leo-hartley', 'working', 'Categorising bank lines, double entry'],
      ['sophie-bennett', 'done', 'Engagement letter drafted'],
      ['henry-collins', 'working', 'Drafting welcome call notes'],
      ['leo-hartley', 'done', 'Bank reconciled, 1 query raised'],
      ['james-whitfield', 'working', 'VAT boxes 1 to 9 with workings'],
      ['victor-hale', 'working', 'Checking engagement terms'],
      ['henry-collins', 'done', 'Call notes ready'],
      ['james-whitfield', 'done', 'VAT draft and check-before-filing list'],
      ['victor-hale', 'done', 'Terms OK, no solicitor needed'],
      ['grace-whitmore', 'working', 'Quality check against office rules'],
      ['grace-whitmore', 'done', 'Passed. One summary sent to Parth'],
      ['parth', 'review', 'Results ready for your review'],
    ];
    demoUntil = Date.now() + steps.length * 2600 + 8000;
    let i = 0;
    const tick = () => {
      if (i >= steps.length) { setTimeout(() => { if (Date.now() >= demoUntil) applyLive(window.LP_LIVE || { agents: {}, feed: [] }); }, 8200); return; }
      const [who, st, text] = steps[i++];
      if (who === 'parth') L.parth = { status: st === 'review' ? 'reviewing' : 'giving task' }; else L.agents[who] = { status: st, task: text };
      L.feed.push({ time: new Date().toLocaleTimeString('en-GB'), who, text });
      L.updated = '';
      applyLive(L); $('mode').textContent = 'demo running'; paintPane(); paintRoster(); select(selected);
      setTimeout(tick, 2600);
    };
    tick();
  }
  $('demoBtn').addEventListener('click', () => playDemo());
  $('sendBtn').addEventListener('click', () => {
    const v = $('q').value.trim(); const note = $('qnote');
    if (!v) { note.textContent = 'Type a task first.'; return; }
    const cmd = '/task ' + v;
    const done = () => { note.textContent = 'Copied. Paste it into Claude Code in your LedgerPeak folder and the team gets to work here.'; };
    try { navigator.clipboard.writeText(cmd).then(done, () => { $('q').value = cmd; $('q').select(); note.textContent = 'Select-all copy this and paste into Claude Code.'; }); }
    catch (e) { $('q').value = cmd; $('q').select(); }
  });

  // ---------- live polling (local file only) ----------
  if (location.protocol === 'file:') setInterval(() => {
    if (Date.now() < demoUntil) return;
    const s = document.createElement('script'); s.src = 'data/live.js?t=' + Date.now();
    s.onload = () => { applyLive(window.LP_LIVE); paintRoster(); if (pane === 'terminal' || pane === 'workers') paintPane(); s.remove(); };
    s.onerror = () => s.remove(); document.body.appendChild(s);
  }, 2500);
  else { $('foot').textContent = 'Snapshot of the office. Live updates run on your laptop copy (office/dashboard/office.html). Press watch demo to see a task flow through the team.'; setTimeout(() => playDemo(), 1500); }

  select(selected);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
